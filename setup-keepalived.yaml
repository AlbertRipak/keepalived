---
- name: Install and configure keepalived
  hosts: loadbalancers
  become: true

  tasks: 
    - name: Install keepalived package
      ansible.builtin.apt:
        name: keepalived
        state: present
        update_cache: true

    - name: Render keepalived configuration
      ansible.builtin.template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart keepalived

    - name: Enalbe and start keepalived
      ansible.builtin.service:
        name: keepalived
        state: started
        enabled: true

    - name: Copy check_nginx.sh file
      ansible.builtin.copy:
        src: ./check_nginx.sh
        dest: /etc/keepalived/check_nginx.sh
        owner: root
        group: root
        mode: "0700"

  handlers:
    - name: Restart keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
